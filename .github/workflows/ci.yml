name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - run: pytest -q tests/test_data.py tests/test_packing.py tests/test_judge.py::TestSwapAverage tests/test_training.py::TestConfig
      - run: pairjudge --version
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            torch: '2.6.0'
            packages: 'transformers==4.57.6 peft==0.18.1 accelerate==1.12.0'
          - python: '3.12'
            torch: '2.14.1'
            packages: 'transformers==5.18.0 peft==0.21.2 accelerate==1.15.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]' ${{ matrix.packages }}
      - run: pytest -q --cov=pairjudge --cov-report=term-missing
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src tests examples/public_judge.py scripts
      - run: ruff format --check src tests examples/public_judge.py scripts
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/check_distributions.py dist
