[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pairjudge"
version = "0.3.0"
description = "Train and use verified pairwise preference judges with multi-turn packing and swap diagnostics"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Daoyuan Li", email = "lidaoyuan2816@gmail.com" }]
keywords = [
    "llm-as-judge",
    "reward-model",
    "preference-learning",
    "rlhf",
    "chatbot-arena",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
# Inference: load a trained judge and predict preferences.
# Single CPU or CUDA device; no automatic multi-device placement.
judge = ["torch>=2.6,<3", "transformers>=4.57.6,<6", "huggingface-hub>=0.36.2,<3", "safetensors>=0.4.3"]
# Training: fine-tune a judge with LoRA on your own preference data.
train = [
    "torch>=2.6,<3",
    "transformers>=4.57.6,<6",
    "huggingface-hub>=0.36.2,<3",
    "peft>=0.18.1,<0.22",
    "accelerate>=1.12,<2",
    "scikit-learn>=1.4",
    "pyarrow>=15",
]
test = [
    "pytest",
    "pytest-cov",
    "ruff",
    "torch>=2.6,<3",
    "transformers>=4.57.6,<6",
    "peft>=0.18.1,<0.22",
    "accelerate>=1.12,<2",
    "scikit-learn>=1.4",
    "pyarrow>=15",
]

[project.scripts]
pairjudge = "pairjudge.cli:main"

[project.urls]
Homepage = "https://github.com/DaoyuanLi2816/pairjudge"
Documentation = "https://daoyuanli2816.github.io/pairjudge/"
Repository = "https://github.com/DaoyuanLi2816/pairjudge"
Issues = "https://github.com/DaoyuanLi2816/pairjudge/issues"
Changelog = "https://github.com/DaoyuanLi2816/pairjudge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = ["competition", "tests/reference_impl.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["pairjudge"]

[tool.coverage.report]
show_missing = true
